name: Validate Archive

on:
  push:
    paths:
      - "hash_archive.csv"
  pull_request:
    paths:
      - "hash_archive.csv"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate archive integrity
        run: python3 validate_archive.py
